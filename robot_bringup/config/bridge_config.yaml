- ros_topic_name: "/clock"
  gz_topic_name:  "/clock"
  ros_type_name:  "rosgraph_msgs/msg/Clock" # you will need to search tp find the type
  gz_type_name:   "ignition.msgs.Clock"    # ign topic -i -t /clock, in modern us gz instead of ign
  direction:  GZ_TO_ROS  #also you have ROS_TO_GZ  and BIDIRECTIONAL


- ros_topic_name: "/scan"
  gz_topic_name:  "/scan"
  ros_type_name:  "sensor_msgs/msg/LaserScan" # you will need to search tp find the type
  gz_type_name:   "ignition.msgs.LaserScan"    # ign topic -i -t /clock, in modern us gz instead of ign
  direction:  GZ_TO_ROS  #also you have ROS_TO_GZ  and BIDIRECTIONAL


